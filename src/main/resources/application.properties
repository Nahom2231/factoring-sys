spring.datasource.url=jdbc:postgresql://localhost:5432/factoring_db
spring.datasource.username=postgres
spring.datasource.password=+inbi+en@#

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Set JWT_SECRET to a private random value of at least 32 UTF-8 bytes.
security.jwt.secret=${JWT_SECRET:}

# Keep the verification API key in the environment, never in source control.
invoice.verification.url=${INVOICE_VERIFICATION_URL:}
invoice.verification.api-key=${INVOICE_VERIFICATION_API_KEY:}
invoice.verification.api-key-header=${INVOICE_VERIFICATION_API_KEY_HEADER:X-API-Key}

# Password reset email settings.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.mail.from=${APP_MAIL_FROM:noreply@fiep.et}