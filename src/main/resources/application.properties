server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:factoring_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:+inbi+en@#}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Set JWT_SECRET to a private random value of at least 32 UTF-8 bytes.
security.jwt.secret=${JWT_SECRET:oAhy4BbS2e6pS7qrZlOE/m1VvGpFnQ+Fcu7ykmEk6UVPyKO3agRicWyZtE1ttWE1}

# Configure these in the hosting provider to create/update the initial Admin account.
app.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Keep the verification API key in the environment, never in source control.
invoice.verification.url=${INVOICE_VERIFICATION_URL:}
invoice.verification.api-key=${INVOICE_VERIFICATION_API_KEY:}
invoice.verification.api-key-header=${INVOICE_VERIFICATION_API_KEY_HEADER:X-API-Key}

# Password reset email settings.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.mail.from=${APP_MAIL_FROM:noreply@fiep.et}
