services:
  - type: web
    name: factoring-backend
    runtime: docker
    plan: free
    region: frankfurt
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: factoring-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: factoring-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: factoring-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: factoring-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: factoring-db
          property: password
      - key: PORT
        value: 8080

databases:
  - name: factoring-db
    databaseName: factoring_db
    user: factoring_user
    plan: free
    region: frankfurt
