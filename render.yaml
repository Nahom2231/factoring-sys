services:
  - type: web
    name: factoring-backend
    runtime: docker
    plan: free
    region: frankfurt
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://dpg-dbrqtlrrjlhs73c9bphg-a:5432/factoring_db
      - key: SPRING_DATASOURCE_USERNAME
        value: factoring_user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: factoring-db
          property: password
      - key: PORT
        value: 8080

databases:
  - name: factoring-db
    databaseName: factoring_db
    user: factoring_user
    plan: free
    region: frankfurt
